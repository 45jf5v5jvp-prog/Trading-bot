# Auto-deploy config. Connect this repo to Netlify once and every push builds
# and publishes automatically — no more dragging files, and everyone gets the
# latest version on next open.
[build]
  command = "npm run build"
  publish = "dist"

# Cache rules also live in public/_headers so manual folder/zip deploys get them
# too; these mirror them for git-based builds.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
