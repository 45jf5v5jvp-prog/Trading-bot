[project]
name = "personal-assistant"
version = "0.1.0"
description = "Mirrors Apple Reminders to iCloud Calendar and suggests events from iCloud Mail and Messages."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "pyobjc-framework-EventKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.sources"]
