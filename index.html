<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ==========================================================
         SHARED LEADERBOARD (optional)
         Paste your Supabase project URL and public anon key here to let
         everyone in the group follow the leaderboard on their own phone.
         Leave both blank to run solo (one phone keeps the card).
         Setup: see README / the handoff notes.
         ========================================================== -->
    <script>
      // Baked in so every build works for everyone, no per-deploy setup. These
      // are public client values by design (they ship to every phone anyway);
      // the real GolfCourseAPI key stays a server secret in the Supabase relay.
      window.SIDE_ACTION_CONFIG = {
        SUPABASE_URL: "https://tsahgjqyoghmprkmxjgb.supabase.co",
        SUPABASE_ANON_KEY: "sb_publishable_m6C3mI_4F_QsmKWuC_1Nkg_R2o4PrUB",
        // Course lookup now runs on this same site (a Netlify Function), so no
        // Supabase and no CORS. The GolfCourseAPI key lives in a Netlify env var.
        GOLF_PROXY: "/.netlify/functions/courses"
      };
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>
